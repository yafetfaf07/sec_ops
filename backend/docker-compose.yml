# Local Docker Compose stack: API + Postgres, mirroring what Render
# provisions (its own managed Postgres instance + this Dockerfile as a web
# service). This is for local development only — Render does not read this
# file; it builds the Dockerfile directly and connects to its own Postgres
# add-on via a DATABASE_URL it injects itself.
#
# Usage: docker compose up --build
# Then:  curl http://localhost:8080/healthz

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@db:5432/secops?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-LocalDev123Password}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secops
    ports:
      - "5432:5432"
    volumes:
      - secops_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secops"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  secops_pg_data:
